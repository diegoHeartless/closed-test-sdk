# Сборка SDK (push/PR). Проверка GPG — отдельный workflow «Verify GPG signing».
name: SDK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "9.6.1"

      - name: Assemble release AAR
        run: |
          gradle :closed-test-sdk:assembleRelease --no-daemon
          gradle :closed-test-sdk-navigation-compose:assembleRelease --no-daemon

      - name: Assemble sample debug
        run: gradle :examples:sample:assembleDebug --no-daemon
