/**
 * Applied only for Maven Central staging / jreleaserDeploy (see root build.gradle.kts).
 * Version must match gradle/libs.versions.toml → jreleaser.
 * Applied scripts cannot use plugins {}; use buildscript + apply plugin instead.
 */
buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'org.jreleaser:org.jreleaser.gradle.plugin:1.25.0'
    }
}

apply plugin: 'org.jreleaser'

def jreleaserConfigFileName =
    findProperty('jreleaserConfigFile') ?: System.getenv('JRELEASER_CONFIG_FILE') ?: 'jreleaser.yml'

jreleaser {
    dependsOnAssemble = false
    configFile = layout.projectDirectory.file(jreleaserConfigFileName)
}

// jreleaserDeploy does not auto-stage modules — each workflow publishes its staging repo first.
tasks.named('jreleaserDeploy') {
    // Intentionally no dependsOn; see publish-maven-central*.yml
}
